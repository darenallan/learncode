<!doctype html>
<html>
  <head>

    <meta
      name="viewport"

    <style>
      :root {
        color-scheme: light;

        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;

  <body>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>Parcours B2 Code</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap"
    />
    <style>
      /* Layout : app une colonne (max 680px), barre d'onglets fixée en bas, leçons en plein écran.
   Palette : fond papier chaud, accent vert sapin ; vert/rouge réservés aux corrections. */
      :root {
        color-scheme: light;
        --bg: #f6f5f1;
        --surface: #ffffff;
        --fg: #17181c;
        --muted: #5f6370;
        --line: #e3e1d9;
        --accent: #0d6e5f;
        --accent-fg: #ffffff;
        --ok: #1d7a43;
        --ok-bg: #e4f5ea;
        --bad: #b42318;
        --bad-bg: #fde8e6;
        --soft: #e6efeb;
        --warn: #9a5b00;
        --warn-bg: #fdf1dc;
        --display: "Bricolage Grotesque", system-ui, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121417;
          --surface: #1b1e23;
          --fg: #eceee9;
          --muted: #9ca1ab;
          --line: #2c3038;
          --accent: #5fd0b7;
          --accent-fg: #0c1f1b;
          --ok: #6fd39a;
          --ok-bg: #15301f;
          --bad: #ff8a80;
          --bad-bg: #3a1714;
          --soft: #1a2b27;
          --warn: #f2b860;
          --warn-bg: #33260f;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #121417;
        --surface: #1b1e23;
        --fg: #eceee9;
        --muted: #9ca1ab;
        --line: #2c3038;
        --accent: #5fd0b7;
        --accent-fg: #0c1f1b;
        --ok: #6fd39a;
        --ok-bg: #15301f;
        --bad: #ff8a80;
        --bad-bg: #3a1714;
        --soft: #1a2b27;
        --warn: #f2b860;
        --warn-bg: #33260f;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding-block: 20px 96px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      body.in-lesson {
        padding-bottom: 24px;
      }
      #app {
        max-width: 680px;
        margin: 0 auto;
        min-width: 0;
      }
      .view {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      h1,
      h2,
      h3 {
        font-family: var(--display);
        margin: 0;
        text-wrap: balance;
        line-height: 1.15;
      }
      h1 {
        font-size: 28px;
      }
      h2 {
        font-size: 19px;
      }
      h3 {
        font-size: 16px;
      }
      p {
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
      }
      .signature {
        text-align: center;
        padding-block: 8px;
      }
      .signature a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
      .signature a:hover {
        text-decoration: underline;
      }
      .eyebrow {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .card.soft {
        background: var(--soft);
        border-color: transparent;
      }
      .card.warn {
        background: var(--warn-bg);
        border-color: transparent;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      @media (max-width: 520px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .stat {
        padding: 12px 14px;
        gap: 2px;
      }
      .stat .v {
        font-family: var(--display);
        font-size: 24px;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .stat .l {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: space-between;
        align-items: center;
      }
      .row > .grow {
        flex: 1 1 200px;
        min-width: 0;
      }
      .bar {
        height: 8px;
        background: var(--line);
        border-radius: 999px;
        overflow: hidden;
      }
      .bar > span {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 0.3s;
      }
      .badge {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        border-radius: 8px;
        padding: 4px 7px;
        background: var(--soft);
        color: var(--accent);
        flex: none;
        min-width: 40px;
        text-align: center;
      }
      .tag {
        font-size: 12px;
        border-radius: 999px;
        padding: 2px 10px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .tag.live {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: transparent;
      }
      .tag.ok {
        background: var(--ok-bg);
        color: var(--ok);
        border-color: transparent;
      }
      .track-head {
        all: unset;
        cursor: pointer;
        display: flex;
        gap: 12px;
        align-items: center;
        width: 100%;
        box-sizing: border-box;
      }
      .track-meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1;
      }
      .track-name {
        font-family: var(--display);
        font-size: 18px;
        font-weight: 700;
        line-height: 1.2;
      }
      .units {
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .unit {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .unit-title {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .unit.locked .unit-title {
        color: var(--muted);
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: none;
        border: 2px solid var(--accent);
      }
      .dot.done {
        background: var(--accent);
      }
      .dot.locked {
        border-color: var(--line);
      }
      button {
        font: inherit;
      }
      .btn {
        cursor: pointer;
        border-radius: 10px;
        padding: 10px 16px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-fg);
        font-weight: 600;
        white-space: nowrap;
      }
      .btn.ghost {
        background: transparent;
        color: var(--accent);
      }
      .btn.sm {
        padding: 6px 12px;
        font-size: 14px;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .link {
        all: unset;
        cursor: pointer;
        color: var(--muted);
        text-decoration: underline;
        font-size: 13px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      pre {
        margin: 0;
        background: var(--soft);
        border-radius: 10px;
        padding: 12px 14px;
        font: 13.5px/1.55 var(--mono);
        overflow-x: auto;
        max-width: 100%;
        color: var(--fg);
      }
      code {
        font-family: var(--mono);
      }
      .prompt {
        font-family: var(--display);
        font-size: 21px;
        line-height: 1.3;
        text-wrap: balance;
      }
      .opts {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .opt {
        text-align: left;
        cursor: pointer;
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .opt.mono {
        font-family: var(--mono);
        font-size: 14px;
      }
      .opt.sel {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .opt.ok {
        background: var(--ok-bg);
        border-color: var(--ok);
        color: var(--ok);
      }
      .opt.bad {
        background: var(--bad-bg);
        border-color: var(--bad);
        color: var(--bad);
      }
      .opt:disabled {
        cursor: default;
      }
      input.text {
        font: 15px var(--mono);
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        width: 100%;
        min-width: 0;
      }
      select {
        font: inherit;
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .answer-zone {
        min-height: 56px;
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .answer-zone.ok {
        border-color: var(--ok);
        background: var(--ok-bg);
      }
      .answer-zone.bad {
        border-color: var(--bad);
        background: var(--bad-bg);
      }
      .pool {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .chip {
        text-align: left;
        cursor: pointer;
        font: 13.5px var(--mono);
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .chip:disabled {
        cursor: default;
      }
      .feedback {
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .feedback.ok {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .feedback.bad {
        background: var(--bad-bg);
        color: var(--bad);
      }
      .feedback p {
        color: var(--fg);
      }
      .center {
        text-align: center;
        align-items: center;
      }
      .big {
        font-family: var(--display);
        font-size: 46px;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .learn p {
        max-width: 65ch;
      }
      .plan-item {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .plan-date {
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        color: var(--muted);
        flex: none;
        width: 92px;
      }
      .plan-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      nav.tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        background: var(--surface);
        border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: max(8px, env(safe-area-inset-left, 0px));
        padding-right: max(8px, env(safe-area-inset-right, 0px));
      }
      nav.tabs .inner {
        max-width: 680px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
      }
      nav.tabs button {
        all: unset;
        cursor: pointer;
        text-align: center;
        padding: 10px 4px 12px;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      nav.tabs button[aria-current="page"] {
        color: var(--accent);
        font-weight: 700;
      }
      nav.tabs svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      nav.tabs .count {
        font-size: 10px;
        background: var(--bad);
        color: var(--surface);
        border-radius: 999px;
        padding: 0 5px;
        margin-left: 2px;
      }
      textarea.text {
        display: block;
        resize: vertical;
        min-height: 120px;
        font: 14px/1.55 var(--mono);
        tab-size: 2;
      }
      .res {
        overflow-x: auto;
        max-width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
      }
      .res table {
        border-collapse: collapse;
        font: 13px/1.4 var(--mono);
        min-width: 100%;
      }
      .res caption {
        text-align: left;
        padding: 8px 10px 4px;
        font:
          12px system-ui,
          sans-serif;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .res th,
      .res td {
        padding: 6px 10px;
        border-top: 1px solid var(--line);
        text-align: left;
        white-space: nowrap;
      }
      .res th {
        color: var(--accent);
        font-weight: 700;
      }
      .res td.null {
        color: var(--muted);
        font-style: italic;
      }
      pre.err {
        background: var(--bad-bg);
        color: var(--bad);
        white-space: pre-wrap;
      }
      details.schema {
        font-size: 14px;
      }
      details.schema summary {
        cursor: pointer;
        color: var(--accent);
        font-weight: 600;
        padding: 2px 0;
      }
      details.schema pre {
        margin-top: 8px;
      }
      .timer {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        color: var(--fg);
      }
      .timer.low {
        color: var(--bad);
      }
      .review {
        border-left: 3px solid var(--ok);
        padding: 6px 0 6px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .review.bad {
        border-left-color: var(--bad);
      }
      .review code {
        overflow-wrap: anywhere;
      }
      .chip-btn {
        cursor: pointer;
        font-size: 13px;
        border-radius: 999px;
        padding: 5px 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--fg);
      }
      .chip-btn:hover {
        border-color: var(--accent);
      }
      .ok-text {
        color: var(--ok);
      }
      .bad-text {
        color: var(--bad);
      }
      .boxes {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .boxcol {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        background: var(--soft);
        border-radius: 10px;
        padding: 10px 4px;
        text-align: center;
      }
      .boxcol .v {
        font-family: var(--display);
        font-size: 22px;
        font-variant-numeric: tabular-nums;
      }
      .boxcol .l {
        font-size: 11px;
        color: var(--muted);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>

    <div id="app" aria-live="polite"></div>
    <nav class="tabs" id="tabs" aria-label="Navigation"></nav>

    <script>
      (function () {
        "use strict";

        /* =====================================================================
     CONTENU — 10 parcours alignés sur le planning B2 2026/2027 (v1.2)
     Convention : dans un QCM, la bonne réponse est écrite en premier ;
     l'ordre est mélangé à l'affichage.
     ===================================================================== */
        const C = (q, o, w, x) => Object.assign({ t: "c", q, o, w }, x || {}); // QCM
        const I = (q, a, w, code) => ({ t: "i", q, a, w, code }); // réponse écrite
        const O = (q, parts, w) => ({ t: "o", q, parts, w }); // remettre dans l'ordre
        const U = (id, title, text, code, ex) => ({
          id,
          title,
          learn: { text, code: code.join("\n") },
          ex,
        });

        const Q = (q, sol, w, x) =>
          Object.assign({ t: "s", q, sol, w }, x || {}); // requête SQL exécutée et corrigée
        const J = (q, starter, rules, sol, w) => ({
          t: "j",
          q,
          starter,
          rules,
          sol,
          w,
        }); // code Java corrigé par analyse

        /* Base fil rouge du parcours SQL : une boutique de Ouagadougou.
     Elle est recréée à neuf avant chaque exécution d'exercice. */
        const SQL_SETUP = [
          "CREATE TABLE categories (id INTEGER PRIMARY KEY, nom TEXT NOT NULL UNIQUE);",
          "CREATE TABLE produits (id INTEGER PRIMARY KEY, nom TEXT NOT NULL, categorie_id INTEGER REFERENCES categories(id), prix INTEGER NOT NULL CHECK (prix > 0), stock INTEGER NOT NULL DEFAULT 0);",
          "CREATE TABLE clients (id INTEGER PRIMARY KEY, nom TEXT NOT NULL, ville TEXT, inscrit_le TEXT NOT NULL);",
          "CREATE TABLE commandes (id INTEGER PRIMARY KEY, client_id INTEGER NOT NULL REFERENCES clients(id), date_cmd TEXT NOT NULL, statut TEXT NOT NULL CHECK (statut IN ('livrée', 'en cours', 'annulée')));",
          "CREATE TABLE lignes (commande_id INTEGER NOT NULL REFERENCES commandes(id) ON DELETE CASCADE, produit_id INTEGER NOT NULL REFERENCES produits(id), quantite INTEGER NOT NULL CHECK (quantite > 0), prix_unitaire INTEGER NOT NULL, PRIMARY KEY (commande_id, produit_id));",
          "CREATE TABLE employes (id INTEGER PRIMARY KEY, nom TEXT NOT NULL, poste TEXT NOT NULL, manager_id INTEGER REFERENCES employes(id), salaire INTEGER NOT NULL);",
          "INSERT INTO categories VALUES (1,'Alimentation'),(2,'Textile'),(3,'Électronique'),(4,'Hygiène'),(5,'Papeterie');",
          "INSERT INTO produits VALUES (1,'Riz parfumé 25 kg',1,17500,40),(2,'Huile d''arachide 5 L',1,6500,25),(3,'Sucre 1 kg',1,750,120),(4,'Pagne Faso Dan Fani',2,12000,15),(5,'Chemise wax',2,8500,10),(6,'Téléphone Itel A70',3,55000,8),(7,'Lampe solaire',3,9500,0),(8,'Savon Koto',4,300,200),(9,'Dentifrice',4,900,60),(10,'Carte cadeau',NULL,5000,50);",
          "INSERT INTO clients VALUES (1,'Awa Ouédraogo','Ouagadougou','2025-01-15'),(2,'Issa Sawadogo','Ouagadougou','2025-02-03'),(3,'Mariam Traoré','Bobo-Dioulasso','2025-02-20'),(4,'Paul Kaboré','Koudougou','2025-03-11'),(5,'Fatimata Zongo','Ouagadougou','2025-04-02'),(6,'Ali Compaoré','Bobo-Dioulasso','2025-05-19'),(7,'Rasmata Ilboudo','Ouahigouya','2025-06-07'),(8,'Salif Diallo',NULL,'2025-06-30');",
          "INSERT INTO commandes VALUES (1,1,'2025-09-02','livrée'),(2,2,'2025-09-05','livrée'),(3,1,'2025-09-14','livrée'),(4,3,'2025-09-20','annulée'),(5,4,'2025-10-01','livrée'),(6,5,'2025-10-03','en cours'),(7,2,'2025-10-08','livrée'),(8,6,'2025-10-10','livrée'),(9,1,'2025-10-12','en cours'),(10,3,'2025-10-15','livrée');",
          "INSERT INTO lignes VALUES (1,1,1,17500),(1,3,4,750),(2,6,1,55000),(3,8,10,300),(3,2,1,6500),(4,4,2,12000),(5,1,2,17500),(5,9,3,900),(6,5,1,8500),(7,3,10,750),(7,8,20,300),(8,6,1,55000),(8,10,1,5000),(9,4,1,12000),(10,2,2,6500),(10,8,5,300);",
          "INSERT INTO employes VALUES (1,'Aminata Kaboré','Gérante',NULL,450000),(2,'Boukary Ouédraogo','Responsable des ventes',1,300000),(3,'Clarisse Somé','Vendeuse',2,150000),(4,'Daouda Sanou','Vendeur',2,150000),(5,'Estelle Yaméogo','Magasinière',1,175000),(6,'Firmin Bationo','Livreur',5,120000);",
        ].join("\n");

        const SQL_SCHEMA = [
          "categories(id, nom)",
          "produits(id, nom, categorie_id → categories, prix, stock)",
          "clients(id, nom, ville, inscrit_le)",
          "commandes(id, client_id → clients, date_cmd, statut)",
          "lignes(commande_id → commandes, produit_id → produits, quantite, prix_unitaire)",
          "employes(id, nom, poste, manager_id → employes, salaire)",
        ].join("\n");

        /* =====================================================================
     ÉTAT — local d'abord, synchronisé avec le compte quand c'est possible
     ===================================================================== */
        const KEY = "parcours-b2-v2";
        const LEGACY_KEY = "parcours-b2-v1";

        function defaults() {
          return {
            v: 2,
            xp: 0,
            streak: 0,
            lastDay: "",
            done: {},
            best: {},
            mistakes: [],
            days: {},
            goal: 30,
            exams: {},
            review: { streak: 0, lastDay: "" },
            updatedAt: 0,
          };
        }
        /* Date du jour au format AAAA-MM-JJ (déclarée ici car normalize() s'exécute avant les utilitaires). */
        function localDay(offset) {
          const d = new Date();
          d.setDate(d.getDate() + (offset || 0));
          return (
            d.getFullYear() +
            "-" +
            String(d.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(d.getDate()).padStart(2, "0")
          );
        }
        function normalize(s) {
          const d = defaults();
          if (!s || typeof s !== "object") return d;
          return {
            v: 2,
            xp: Number(s.xp) || 0,
            streak: Number(s.streak) || 0,
            lastDay: typeof s.lastDay === "string" ? s.lastDay : "",
            done: s.done && typeof s.done === "object" ? s.done : {},
            best: s.best && typeof s.best === "object" ? s.best : {},
            // Révision espacée : box = étape (0 à 4), due = date à laquelle la question revient.
            mistakes: Array.isArray(s.mistakes)
              ? s.mistakes
                  .filter(
                    (m) =>
                      m && typeof m.u === "string" && Number.isInteger(m.i),
                  )
                  .map((m) => ({
                    u: m.u,
                    i: m.i,
                    box: Math.min(
                      4,
                      Math.max(0, Math.floor(Number(m.box) || 0)),
                    ),
                    due: /^\d{4}-\d{2}-\d{2}$/.test(m.due) ? m.due : localDay(),
                  }))
              : [],
            review:
              s.review && typeof s.review === "object"
                ? {
                    streak: Math.max(
                      0,
                      Math.floor(Number(s.review.streak) || 0),
                    ),
                    lastDay:
                      typeof s.review.lastDay === "string"
                        ? s.review.lastDay
                        : "",
                  }
                : { streak: 0, lastDay: "" },
            days: s.days && typeof s.days === "object" ? s.days : {},
            goal: [10, 30, 50, 100].includes(s.goal) ? s.goal : 30,
            // Examens blancs par parcours : { sql: { best, last, count }, java: … }. L'ancien champ exam (SQL seul) est repris.
            exams: (() => {
              const src =
                s.exams && typeof s.exams === "object"
                  ? s.exams
                  : s.exam && typeof s.exam === "object"
                    ? { sql: s.exam }
                    : {};
              const out = {};
              Object.keys(src).forEach((k) => {
                const e = src[k];
                if (/^[a-z]+$/.test(k) && e && typeof e === "object")
                  out[k] = {
                    best: Number(e.best) || 0,
                    last: e.last == null ? null : Number(e.last) || 0,
                    count: Number(e.count) || 0,
                  };
              });
              return out;
            })(),
            updatedAt: Number(s.updatedAt) || 0,
          };
        }
        function loadLocal() {
          try {
            const raw = localStorage.getItem(KEY);
            if (raw) return normalize(JSON.parse(raw));
            const old = JSON.parse(localStorage.getItem(LEGACY_KEY) || "null"); // reprise de la V1
            if (old) {
              const s = defaults();
              s.xp = Number(old.xp) || 0;
              s.streak = Number(old.streak) || 0;
              s.lastDay = old.lastDay || "";
              const map = {
                "sql-1": "sql-1",
                "sql-2": "sql-2",
                "java-1": "java-1",
                "java-2": "java-3",
                "py-1": "py-1",
                "py-2": "py-2",
                "js-1": "js-1",
                "js-2": "js-4",
                "html-1": "web-1",
                "html-2": "web-2",
                "bash-1": "sh-1",
                "bash-2": "sh-2",
              };
              Object.keys(old.done || {}).forEach((k) => {
                if (map[k]) s.done[map[k]] = true;
              });
              s.updatedAt = Date.now();
              return s;
            }
          } catch (e) {
            /* stockage indisponible */
          }
          return defaults();
        }
        function saveLocal() {
          try {
            localStorage.setItem(KEY, JSON.stringify(state));
          } catch (e) {
            /* ignoré */
          }
        }

        let state = loadLocal();
        let remoteRef = null;
        let syncStatus = "local"; // local | cloud | error
        let pushTimer = null;

        function commit() {
          state.updatedAt = Date.now();
          saveLocal();
          if (!remoteRef) return;
          clearTimeout(pushTimer);
          pushTimer = setTimeout(async () => {
            try {
              await remoteRef.set(JSON.parse(JSON.stringify(state)));
              syncStatus = "cloud";
            } catch (e) {
              syncStatus = "error";

        async function initSync() {

            if (!uid) return;
            const ref = db.doc("data/users/" + uid + "/progress");
            const snap = await ref.get();
            if (snap.exists) {
              const remote = normalize(snap.data());
              if (remote.updatedAt > state.updatedAt) {
                state = remote;
                saveLocal();
              } else if (state.updatedAt > remote.updatedAt) {
                await ref.set(JSON.parse(JSON.stringify(state)));
              }
            } else if (state.updatedAt) {
              await ref.set(JSON.parse(JSON.stringify(state)));
            }
            remoteRef = ref;
            syncStatus = "cloud";
            if (!session) render();
          } catch (e) {
            syncStatus = remoteRef ? "error" : "local";

        const pad = (n) => String(n).padStart(2, "0");
        const dayStr = (d) =>

        const today = () => dayStr(new Date());

        const daysUntil = (s) =>

            .toLowerCase()
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .replace(/[\s'"`;]/g, "");
        function shuffle(a) {
          const r = a.slice();
          for (let i = r.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [r[i], r[j]] = [r[j], r[i]];

        function el(tag, attrs, ...kids) {
          const n = document.createElement(tag);
          for (const [k, v] of Object.entries(attrs || {})) {
            if (v === false || v == null) continue;
            if (k === "class") n.className = v;
            else if (k === "style") n.setAttribute("style", v);
            else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
            else n.setAttribute(k, v === true ? "" : String(v));
          }
          for (const kid of kids.flat(Infinity)) {
            if (kid == null || kid === false) continue;
            n.append(
              kid instanceof Node ? kid : document.createTextNode(String(kid)),
            );
          }
          return n;
        }
        function svg(path) {
          const s = document.createElementNS(
            "http://www.w3.org/2000/svg",

          s.setAttribute("viewBox", "0 0 24 24");
          s.setAttribute("aria-hidden", "true");

        /* =====================================================================
     MOTEUR SQL : SQLite (sql.js) dans un Worker, chargé à la demande.
     Une requête sans fin est coupée au bout de 4 s. Sans moteur
     (hors ligne, CDN bloqué), la correction passe par des mots-clés.
     ===================================================================== */
        const SQLJS_URL =
          "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/"; // version épinglée (SQLite 3.45)
        const SQL_WORKER_SRC = [
          'importScripts("' + SQLJS_URL + 'sql-wasm.js");',
          'const ready = initSqlJs({ locateFile: f => "' +
            SQLJS_URL +
            '" + f });',
          "let box = null;",
          "const last = (db, code) => { const r = db.exec(code); const t = r[r.length - 1]; return t ? { columns: t.columns, rows: t.values } : null; };",
          'const total = db => db.exec("SELECT total_changes()")[0].values[0][0];',
          "onmessage = async e => {",
          "  const { id, op, setup, code, verify, reset } = e.data;",
          "  let SQL;",
          "  try { SQL = await ready; } catch (err) { postMessage({ id, fatal: true }); return; }",
          "  let db;",
          "  try {",
          '    if (op === "box") { if (!box || reset) { if (box) box.close(); box = new SQL.Database(); box.run(setup); } db = box; }',
          "    else { db = new SQL.Database(); db.run(setup); }",
          "    const before = total(db);",
          "    let table;",
          "    try { table = code.trim() ? last(db, code) : null; } catch (err) { postMessage({ id, error: err.message }); return; }",
          "    const changes = total(db) - before;",
          "    if (verify) table = last(db, verify);",
          "    postMessage({ id, table, changes });",
          "  } catch (err) { postMessage({ id, error: err.message }); }",
          "  finally { if (db && db !== box) db.close(); }",
          "};",
        ].join("\n");

        let sqlWorker = null,
          sqlSeq = 0,
          sqlState = "idle"; // idle | loading | ready | error
        const sqlPending = new Map();

        function sqlFailAll() {
          sqlPending.forEach((p) => {
            clearTimeout(p.timer);
            p.reject(new Error("moteur"));
          });
          sqlPending.clear();
        }
        function sqlBoot() {
          const w = new Worker(
            URL.createObjectURL(
              new Blob([SQL_WORKER_SRC], { type: "text/javascript" }),
            ),
          );
          w.onmessage = (e) => {
            const p = sqlPending.get(e.data.id);
            if (!p) return;
            sqlPending.delete(e.data.id);
            clearTimeout(p.timer);
            if (e.data.fatal) {
              sqlState = "error";
              p.reject(new Error("moteur"));
            } else {
              sqlState = "ready";
              p.resolve(e.data);
            }
          };
          w.onerror = () => {
            sqlState = "error";
            sqlFailAll();
            w.terminate();
            if (sqlWorker === w) sqlWorker = null;
          };
          sqlWorker = w;
          sqlState = "loading";
        }
        function sqlCall(msg) {
          if (sqlState === "error") return Promise.reject(new Error("moteur"));
          if (!sqlWorker) {
            try {
              sqlBoot();
            } catch (e) {
              sqlState = "error";
              return Promise.reject(e);
            }
          }
          const id = ++sqlSeq,
            w = sqlWorker;
          return new Promise((resolve, reject) => {
            const timer = setTimeout(
              () => {
                sqlPending.delete(id);
                const loading = sqlState !== "ready";
                w.terminate();
                if (sqlWorker === w) sqlWorker = null;
                sqlFailAll();
                if (loading) {
                  sqlState = "error";
                  reject(new Error("moteur"));
                } else {
                  sqlState = "idle";
                  resolve({
                    error:
                      "Temps dépassé (4 s) : la requête ne s'arrête pas. Une CTE récursive sans condition d'arrêt ?",
                  });
                }
              },
              sqlState === "ready" ? 4000 : 25000,
            );
            sqlPending.set(id, { resolve, reject, timer });
            w.postMessage(Object.assign({ id }, msg));
          });
        }
        const sqlRun = (code, verify) =>
          sqlCall({ op: "run", setup: SQL_SETUP, code, verify });
        function sqlWarm() {
          if (sqlState === "idle")
            sqlCall({ op: "run", setup: "", code: "" }).catch(() => {});
        }
        function engineLabel() {
          return sqlState === "ready"
            ? "Moteur SQLite prêt · Ctrl+Entrée pour valider"
            : sqlState === "loading"
              ? "Chargement du moteur SQL…"
              : sqlState === "error"
                ? "Moteur SQL indisponible : correction simplifiée"
                : "Le moteur SQL se charge à la première exécution";
        }

        const cell = (v) =>
          typeof v === "number" ? Math.round(v * 1e6) / 1e6 : v;
        function sameTable(a, b, ordered) {
          if (!a || !b) return !a && !b;
          if (
            a.columns.length !== b.columns.length ||
            a.rows.length !== b.rows.length
          )
            return false;
          const key = (r) => JSON.stringify(r.map(cell));
          const ra = a.rows.map(key),
            rb = b.rows.map(key);
          if (!ordered) {
            ra.sort();
            rb.sort();
          }
          return ra.every((r, k) => r === rb[k]);
        }

        /* Corrige une requête : on compare son résultat à celui de la solution, sur une base neuve. */
        async function gradeSql(ex, code) {
          const up = " " + code.toUpperCase().replace(/\s+/g, " ") + " ";
          const missing = (ex.need || []).filter(
            (k) => !up.includes(k.toUpperCase()),
          );
          try {
            const mine = await sqlRun(code, ex.verify);
            if (mine.error)
              return { ok: false, mine, msg: "Ta requête renvoie une erreur." };
            const ref = await sqlRun(ex.sol, ex.verify);
            const same = sameTable(mine.table, ref.table, !!ex.ordered);
            if (same && missing.length)
              return {
                ok: false,
                mine,
                msg:
                  "Le résultat est bon, mais l'exercice demande d'utiliser " +
                  missing.join(", ") +
                  ".",
              };
            return {
              ok: same,
              mine,
              expected: same ? null : ref,
              msg: same
                ? null
                : ex.ordered
                  ? "Le résultat ne correspond pas (ici, l'ordre des lignes compte)."
                  : "Le résultat ne correspond pas au résultat attendu.",
            };
          } catch (e) {
            const ok =
              norm(code) === norm(ex.sol) ||
              (!!(ex.need && ex.need.length) && !missing.length);
            return {
              ok,
              fallback: true,
              msg:
                "Moteur SQL indisponible : correction simplifiée, par mots-clés." +
                (!ok && missing.length
                  ? " Il manque : " + missing.join(", ") + "."
                  : ""),
            };
          }
        }

        function resTable(t, caption) {

          return el(

        function resBlock(r, caption) {

        function sqlGradeView(g) {

            "div",

        /* Correction Java sans exécution : on vérifie, commentaires retirés, que le code contient
     les éléments attendus (règles [regex, message]) ou pas les éléments interdits ([regex, message, true]). */
        function gradeJava(ex, code) {
          const clean = code
            .replace(/\/\*[\s\S]*?\*\//g, "")
            .replace(/\/\/.*$/gm, "");
          const missing = ex.rules
            .filter(([re, , forbid]) =>
              forbid ? re.test(clean) : !re.test(clean),
            )
            .map((r) => r[1]);
          return { ok: !missing.length, missing };
        }
        function javaGradeView(g) {
          if (!g || !g.missing || !g.missing.length) return null;
          return el(
            "div",
            { class: "list", style: "gap:6px" },
            el("p", { class: "small" }, "Ce qui manque encore :"),
            el(
              "ul",
              { class: "small", style: "margin:0;padding-left:20px" },
              g.missing.map((m) => el("li", {}, m)),
            ),
          );
        }

        function schemaBox(open) {
          const d = el(
            "details",
            { class: "schema" },
            el("summary", {}, "Les tables de la boutique"),
            el("pre", {}, el("code", {}, SQL_SCHEMA)),
          );
          if (open) d.open = true;
          return d;
        }
        const fmtClock = (ms) => {
          const t = Math.max(0, Math.round(ms / 1000));
          return pad(Math.floor(t / 60)) + ":" + pad(t % 60);
        };

        /* ---------- Règles de progression ---------- */
        const allUnits = () =>
          TRACKS.flatMap((t) =>
            t.units.map((u, i) => ({ track: t, unit: u, index: i })),
          );
        const findUnit = (id) => allUnits().find((x) => x.unit.id === id);
        const unitDone = (u) => !!state.done[u.id];
        const isUnlocked = (t, i) =>
          i === 0 || unitDone(t.units[i]) || unitDone(t.units[i - 1]);
        const trackDone = (t) => t.units.every(unitDone);
        const trackCount = (t) => t.units.filter(unitDone).length;
        const level = () => Math.floor(state.xp / 100) + 1;
        const xpToday = () => state.days[today()] || 0;
        const liveStreak = () =>
          state.lastDay === today() || state.lastDay === yesterday()
            ? state.streak
            : 0;

        function trackStatus(t) {
          const d = today();
          if (d < t.start)
            return {
              key: "soon",
              label:
                "Au cours le " +
                fmt(t.start, { day: "numeric", month: "long" }),
            };
          if (d > t.end) return { key: "past", label: "Cours terminé" };
          return { key: "live", label: "Au programme en ce moment" };
        }
        function currentTrack() {
          return (
            TRACKS.find(
              (t) => trackStatus(t).key === "live" && !trackDone(t),
            ) ||
            TRACKS.find(
              (t) => trackStatus(t).key === "soon" && !trackDone(t),
            ) ||
            TRACKS.find((t) => !trackDone(t)) ||
            null
          );
        }
        function nextUnit(t) {
          if (!t) return null;
          const i = t.units.findIndex(
            (u, k) => !unitDone(u) && isUnlocked(t, k),
          );
          return i >= 0 ? { track: t, unit: t.units[i], index: i } : null;
        }

        function addXp(n) {
          if (n <= 0) return;
          state.xp += n;
          const d = today();
          state.days[d] = (state.days[d] || 0) + n;
          const keys = Object.keys(state.days).sort();
          while (keys.length > 60) delete state.days[keys.shift()];
          if (state.lastDay !== d) {
            state.streak = state.lastDay === yesterday() ? state.streak + 1 : 1;
            state.lastDay = d;
          }
        }
        /* Révision espacée (boîtes de Leitner) : une question ratée revient le jour même.
     Chaque réussite à la date prévue la repousse de 1, 3, 7 puis 14 jours ; à la 5e, elle est acquise. */
        const SRS_DAYS = [1, 3, 7, 14];
        const dueMistakes = () =>
          state.mistakes.filter((m) => m.due <= today());
        function addMistake(u, i) {
          const m = state.mistakes.find((x) => x.u === u && x.i === i);
          if (m) {
            m.box = 0;
            m.due = today();
          } else state.mistakes.push({ u, i, box: 0, due: today() });
        }
        function promoteMistake(u, i) {
          const m = state.mistakes.find((x) => x.u === u && x.i === i);
          if (!m || m.due > today()) return; // pas encore à revoir : une réussite anticipée ne compte pas
          if (m.box >= SRS_DAYS.length) {
            state.mistakes = state.mistakes.filter((x) => x !== m);
            return;
          }
          m.due = localDay(SRS_DAYS[m.box]);
          m.box += 1;
        }
        const liveReviewStreak = () =>
          state.review.lastDay === today() ||
          state.review.lastDay === yesterday()
            ? state.review.streak
            : 0;

        /* =====================================================================
     SESSIONS : unité, test de niveau, révision
     ===================================================================== */
        const ui = {
          tab: "accueil",
          openTrack: null,
          resetArmed: false,
          io: null,
          code: "",
          codeIn: "",
        };
        let session = null;

        function prepare(ex, ref) {
          const item = { ex, ref };
          if (ex.t === "c") {
            item.order = shuffle(ex.o.map((_, k) => k));
          }
          if (ex.t === "o") {
            let p = shuffle(ex.parts.map((_, k) => k));
            if (p.length > 1 && p.every((v, k) => v === k))
              p = p.slice(1).concat(p[0]);
            item.pool = p;
          }
          return item;
        }

        function startUnit(track, index) {
          const unit = track.units[index];
          session = {
            mode: "unit",
            track,
            unit,
            unitIndex: index,
            title: track.name + " · " + unit.title,
            phase: "learn",
            items: unit.ex.map((ex, i) => prepare(ex, { u: unit.id, i })),
          };
          resetStep();
          render();
          window.scrollTo(0, 0);
        }

        function startPlacement(track) {
          const items = [];
          track.units.forEach((u) =>
            u.ex
              .slice(-2)
              .forEach((ex, k) =>
                items.push(prepare(ex, { u: u.id, i: u.ex.length - 2 + k })),
              ),
          );
          session = {
            mode: "placement",
            track,
            title: "Test de niveau · " + track.name,
            phase: "ex",
            items,
          };
          resetStep();
          render();
          window.scrollTo(0, 0);
        }

        function startReview() {
          const picks = shuffle(dueMistakes()).slice(0, 10);
          const items = picks
            .map((m) => {
              const f = findUnit(m.u);
              return f && f.unit.ex[m.i] ? prepare(f.unit.ex[m.i], m) : null;
            })
            .filter(Boolean);
          if (!items.length) return;
          session = {
            mode: "review",
            title: "Révision de tes erreurs",
            phase: "ex",
            items,
          };
          resetStep();
          render();
          window.scrollTo(0, 0);
        }

        /* Examen blanc : questions tirées dans toutes les unités SQL, chronométrées, corrigées à la fin. */
        const EXAM_SIZE = 20,
          EXAM_MIN = 30;
        let examTimer = null;

        const EXAM_TITLES = {
          sql: "Examen blanc · SQL avancé",
          java: "Examen blanc · Java POO & Design Patterns",
        };
        const examStat = (id) =>
          state.exams[id] || { best: 0, last: null, count: 0 };

        function startExam(trackId) {
          const t = TRACKS.find((x) => x.id === trackId);
          if (!t) return;
          const pools = t.units.map((u) =>
            shuffle(u.ex.map((ex, i) => ({ ex, ref: { u: u.id, i } }))),
          );
          const first = pools.map((p) => p[0]); // au moins une question par unité
          const rest = shuffle(pools.flatMap((p) => p.slice(1))).slice(
            0,
            Math.max(0, EXAM_SIZE - first.length),
          );
          const now = Date.now();
          session = {
            mode: "exam",
            track: t,
            title: EXAM_TITLES[t.id] || "Examen blanc · " + t.name,
            phase: "ex",
            items: shuffle(first.concat(rest)).map((p) => prepare(p.ex, p.ref)),
            answers: [],
            started: now,
            deadline: now + EXAM_MIN * 60000,
          };
          resetStep();
          if (t.id === "sql") sqlWarm();
          render();
          window.scrollTo(0, 0);
          stopExamTimer();
          examTimer = setInterval(examTick, 1000);
        }
        function stopExamTimer() {
          clearInterval(examTimer);
          examTimer = null;
        }
        function examTick() {
          const s = session;
          if (!s || s.mode !== "exam" || s.phase !== "ex") {
            stopExamTimer();
            return;
          }
          const left = s.deadline - Date.now();
          const timer = document.getElementById("timer");
          if (timer) {
            timer.textContent = " · " + fmtClock(left);
            timer.classList.toggle("low", left < 5 * 60000);
          }
          if (left > 0 || s.busy) return;
          // Temps écoulé : les questions restantes comptent comme fausses.
          while (s.results.length < s.items.length) {
            const item = s.items[s.results.length];
            s.results.push(false);
            s.answers.push({ item, given: "", ok: false });
            addMistake(item.ref.u, item.ref.i);
          }
          s.i = s.items.length;
          s.timeUp = true;
          finish();
          render();
          window.scrollTo(0, 0);
        }

        function resetStep() {
          Object.assign(session, {
            i: session.i || 0,
            sel: null,
            text: "",
            picked: [],
            checked: false,
            correct: false,
            grade: null,
            preview: null,
            busy: false,
            running: false,
          });
          session.results = session.results || [];
        }

        function givenAnswer(s, item) {
          const ex = item.ex;
          if (ex.t === "c")
            return s.sel === null ? "" : ex.o[item.order[s.sel]];
          if (ex.t === "o") return s.picked.map((k) => ex.parts[k]).join("\n");
          return s.text.trim();
        }

        async function check() {
          const s = session,
            item = s.items[s.i],
            ex = item.ex;
          if (ex.t === "c")
            s.correct = s.sel !== null && item.order[s.sel] === 0;
          else if (ex.t === "i")
            s.correct = ex.a.some((a) => norm(a) === norm(s.text));
          else if (ex.t === "s") {
            s.busy = true;
            render();
            s.grade = s.text.trim()
              ? await gradeSql(ex, s.text)
              : { ok: false, msg: "Aucune requête." };
            s.busy = false;
            if (session !== s) return;
            s.correct = s.grade.ok;
          } else if (ex.t === "j") {
            s.grade = gradeJava(ex, s.text);
            s.correct = s.grade.ok;
          } else
            s.correct =
              s.picked.length === ex.parts.length &&
              s.picked.every((v, k) => v === k);
          s.checked = true;
          s.results.push(s.correct);
          if (s.mode === "exam")
            s.answers.push({
              item,
              given: givenAnswer(s, item),
              ok: s.correct,
            });
          if (s.correct) {
            if (s.mode !== "placement") promoteMistake(item.ref.u, item.ref.i);
          } else if (s.mode !== "placement") addMistake(item.ref.u, item.ref.i);
          commit();
        }

        function next() {
          const s = session;
          s.i++;
          s.sel = null;
          s.text = "";
          s.picked = [];
          s.checked = false;
          s.correct = false;
          s.grade = null;
          s.preview = null;
          if (s.i >= s.items.length) finish();
        }

        function finish() {
          const s = session;
          const score = s.results.filter(Boolean).length,
            total = s.items.length;
          s.phase = "result";
          s.score = score;
          s.total = total;
          s.gained = 0;
          if (s.mode === "unit") {
            s.passed = score / total >= 0.75;
            const first = !unitDone(s.unit);
            if (s.passed) {
              s.gained = score * (first ? 10 : 2);
              state.done[s.unit.id] = true;
            }
            state.best[s.unit.id] = Math.max(state.best[s.unit.id] || 0, score);
          } else if (s.mode === "placement") {
            let validated = 0;
            for (let k = 0; k < s.track.units.length; k++) {
              const ok = s.results[k * 2] && s.results[k * 2 + 1];
              if (!ok) break;
              state.done[s.track.units[k].id] = true;
              validated++;
            }
            s.validated = validated;
            s.gained = validated * 15;
          } else if (s.mode === "exam") {
            stopExamTimer();
            s.pct = Math.round((score / total) * 100);
            s.elapsed = Math.min(Date.now(), s.deadline) - s.started;
            s.gained = score * 3;
            const prev = examStat(s.track.id);
            state.exams[s.track.id] = {
              best: Math.max(prev.best, s.pct),
              last: s.pct,
              count: prev.count + 1,
            };
          } else {
            s.gained = score * 5;
            const d = today();
            if (state.review.lastDay !== d) {
              state.review = {
                streak:
                  state.review.lastDay === yesterday()
                    ? state.review.streak + 1
                    : 1,
                lastDay: d,
              };
            }
          }
          addXp(s.gained);
          commit();
        }

        /* ---------- Sauvegarde : export / import de la progression ----------
     Format versionné : { app: "parcours-b2", format: 1, exportedAt, progress }.
     L'import fusionne avec la progression actuelle, il n'efface jamais rien. */
        const EXPORT_APP = "parcours-b2",
          EXPORT_FORMAT = 1;
        const knownUnits = () => new Set(allUnits().map((x) => x.unit.id));

        function exportPayload() {
          return {
            app: EXPORT_APP,
            format: EXPORT_FORMAT,
            exportedAt: new Date().toISOString(),
            progress: JSON.parse(JSON.stringify(state)),
          };
        }

        /* Valide une sauvegarde et ne garde que des données propres (unités connues, nombres, dates). */
        function readPayload(obj) {
          if (!obj || typeof obj !== "object" || obj.app !== EXPORT_APP)
            throw new Error("Ce fichier ne vient pas de Parcours B2 Code.");
          if (obj.format !== EXPORT_FORMAT)
            throw new Error(
              "Version de sauvegarde non prise en charge (" + obj.format + ").",
            );
          if (!obj.progress || typeof obj.progress !== "object")
            throw new Error("La sauvegarde est vide ou abîmée.");
          const p = normalize(obj.progress),
            units = knownUnits(),
            isDay = (d) => /^\d{4}-\d{2}-\d{2}$/.test(d);
          const done = {},
            best = {},
            days = {};
          Object.keys(p.done).forEach((k) => {
            if (units.has(k) && p.done[k] === true) done[k] = true;
          });
          Object.keys(p.best).forEach((k) => {
            const n = Number(p.best[k]);
            if (units.has(k) && n >= 0 && n <= 50) best[k] = Math.floor(n);
          });
          Object.keys(p.days).forEach((k) => {
            const n = Number(p.days[k]);
            if (isDay(k) && n >= 0) days[k] = Math.floor(n);
          });
          return Object.assign(p, {
            done,
            best,
            days,
            xp: Math.max(0, Math.floor(p.xp)),
            streak: Math.max(0, Math.floor(p.streak)),
            lastDay: isDay(p.lastDay) ? p.lastDay : "",
            mistakes: p.mistakes.filter(
              (m) => units.has(m.u) && m.i >= 0 && m.i < 50,
            ),
          });
        }

        /* Fusion de deux progressions (ex. PC + téléphone) : on garde le meilleur de chaque côté. */
        function mergeState(a, b) {
          const newer = a.updatedAt >= b.updatedAt ? a : b,
            latest = a.lastDay >= b.lastDay ? a : b;
          const best = Object.assign({}, a.best);
          Object.keys(b.best).forEach((k) => {
            best[k] = Math.max(best[k] || 0, b.best[k]);
          });
          const days = Object.assign({}, a.days);
          Object.keys(b.days).forEach((k) => {
            days[k] = Math.max(days[k] || 0, b.days[k]);
          });
          const byKey = new Map();
          a.mistakes.concat(b.mistakes).forEach((m) => {
            const key = m.u + "#" + m.i,
              prev = byKey.get(key);
            if (!prev || (m.box || 0) < (prev.box || 0)) byKey.set(key, m); // en cas de doute, on revoit plus tôt
          });
          return normalize(
            Object.assign({}, newer, {
              xp: Math.max(a.xp, b.xp),
              streak: latest.streak,
              lastDay: latest.lastDay,
              done: Object.assign({}, a.done, b.done),
              best,
              days,
              mistakes: [...byKey.values()],
              exams: (() => {
                const out = {},
                  older = newer === a ? b : a;
                new Set(
                  Object.keys(a.exams).concat(Object.keys(b.exams)),
                ).forEach((k) => {
                  const x = a.exams[k] || { best: 0, last: null, count: 0 },
                    y = b.exams[k] || { best: 0, last: null, count: 0 };
                  const n = newer.exams[k],
                    o = older.exams[k];
                  out[k] = {
                    best: Math.max(x.best, y.best),
                    last: n && n.last != null ? n.last : o ? o.last : null,
                    count: Math.max(x.count, y.count),
                  };
                });
                return out;
              })(),
              updatedAt: Math.max(a.updatedAt, b.updatedAt),
            }),
          );
        }

        async function importFile(file) {
          if (!file) return;
          try {
            if (file.size > 1000000)
              throw new Error("Fichier trop gros pour être une sauvegarde.");
            let obj;
            try {
              obj = JSON.parse(await file.text());
            } catch (e) {
              throw new Error("Ce fichier n'est pas un JSON valide.");
            }
            applyImport(readPayload(obj), "Fichier");
          } catch (e) {
            ui.io = { ok: false, text: e.message };
            render();
          }
        }

        /* Code de transfert : la sauvegarde compressée en texte, à copier-coller d'un appareil à l'autre. */
        const b64u = {
          enc: (bytes) => {
            let s = "";
            bytes.forEach((b) => {
              s += String.fromCharCode(b);
            });
            return btoa(s)
              .replace(/\+/g, "-")
              .replace(/\//g, "_")
              .replace(/=+$/, "");
          },
          dec: (s) =>
            Uint8Array.from(
              atob(s.replace(/-/g, "+").replace(/_/g, "/")),
              (c) => c.charCodeAt(0),
            ),
        };
        async function pipeBytes(bytes, stream) {
          return new Uint8Array(
            await new Response(
              new Blob([bytes]).stream().pipeThrough(stream),
            ).arrayBuffer(),
          );
        }

        async function makeCode() {
          const bytes = new TextEncoder().encode(
            JSON.stringify(exportPayload()),
          );
          if (window.CompressionStream)
            return (
              "B2Z." +
              b64u.enc(
                await pipeBytes(bytes, new CompressionStream("deflate-raw")),
              )
            );
          return "B2J." + b64u.enc(bytes);
        }
        async function readCode(raw) {
          const code = raw.replace(/\s+/g, ""),
            kind = code.slice(0, 4);
          let bytes;
          try {
            bytes = b64u.dec(code.slice(4));
            if (kind === "B2Z.") {
              if (!window.DecompressionStream) throw new Error("old");
              bytes = await pipeBytes(
                bytes,
                new DecompressionStream("deflate-raw"),
              );
            } else if (kind !== "B2J.") throw new Error("kind");
            return readPayload(JSON.parse(new TextDecoder().decode(bytes)));
          } catch (e) {
            if (e.message === "old")
              throw new Error(
                "Ce navigateur est trop ancien pour lire ce code. Utilise plutôt l'export en fichier.",
              );
            if (/Parcours B2|Version|abîmée/.test(e.message)) throw e;
            throw new Error(
              "Code invalide ou incomplet. Vérifie que tu l'as copié en entier.",
            );
          }
        }
