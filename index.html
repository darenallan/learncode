            ),
            progressBar(
              state.xp % 100,
              100,
              "Progression vers le niveau suivant",
            ),
            el(
              "section",
              { class: "card" },
              el(
                "div",
                { class: "row" },
                el(
                  "label",
                  { for: "goal" },
                  el("h3", {}, "Objectif quotidien"),
                ),
                el(
                  "select",
                  {
                    id: "goal",
                    onchange: (e) => {
                      state.goal = Number(e.target.value);
                      commit();
                      render();
                    },
                  },
                  [10, 30, 50, 100].map((g) => {
                    const o = el("option", { value: g }, g + " XP");
                    if (g === state.goal) o.selected = true;
                    return o;
                  }),
                ),
              ),
              el("p", { class: "small muted" }, "30 XP ≈ une unité par jour."),
            ),
            el(
              "section",
              { class: "card" },
              el("h3", {}, "Progression par parcours"),
              TRACKS.map((t) =>
                el(
                  "div",
                  { class: "list", style: "gap:4px" },
                  el(
                    "div",
                    { class: "row" },
                    el("span", {}, t.name),
                    el(
                      "span",
                      { class: "small muted" },
                      trackCount(t) + "/" + t.units.length,
                    ),
                  ),
                  progressBar(trackCount(t), t.units.length, t.name),
                ),
              ),
            ),
            el(
              "section",
              { class: "card" },
              el("h3", {}, "Sauvegarde et transfert"),
              el("p", { class: "small muted" }, syncText),
              saveTools(),
            ),
            el(
              "button",
              {
                class: "link",
                type: "button",
                style: "align-self:center",
                onclick: () => {
                  if (!ui.resetArmed) {
                    ui.resetArmed = true;
                    render();
                    return;
                  }
                  state = defaults();
                  ui.resetArmed = false;
                  commit();
                  render();
                },
              },
              ui.resetArmed
                ? "Confirmer : tout effacer"
                : "Réinitialiser ma progression",
            ),
          );
        }

        /* ---------- Leçon ---------- */
        function sessionView() {
          const s = session;
          const quit = el(
            "button",
            {
              class: "btn ghost sm",
              type: "button",
              onclick: () => {
                session = null;
                render();
              },
            },
            "Quitter",
          );

          if (s.phase === "learn") {
            const L = s.unit.learn;
            if (s.track.id === "sql") sqlWarm();
            return el(
              "section",
              { class: "view" },
              el(
                "div",
                { class: "row" },
                quit,
                el("span", { class: "muted small" }, "Leçon"),
              ),
              el(
                "p",
                { class: "eyebrow" },
                s.track.name + " · unité " + (s.unitIndex + 1),
              ),
              el("h1", {}, s.unit.title),
              el(
                "div",
                { class: "card learn" },
                L.text.map((p) => el("p", {}, p)),
                el("pre", {}, el("code", {}, L.code)),
              ),
              el(
                "div",
                { class: "row" },
                el(
                  "span",
                  { class: "muted small" },
                  s.items.length + " exercices · 75 % pour valider",
                ),
                el(
                  "button",
                  {
                    class: "btn",
                    type: "button",
                    id: "primary",
                    onclick: () => {
                      s.phase = "ex";
                      render();
                    },
                  },
                  "Aux exercices",
                ),
              ),
            );
          }
          if (s.phase === "result") return resultView();

          const item = s.items[s.i],
            ex = item.ex;
          let body, ready;
          if (ex.t === "c") {
            ready = s.sel !== null;
            body = el(
              "div",
              { class: "opts", role: "radiogroup", "aria-label": "Réponses" },
              item.order.map((orig, pos) => {
                let cls = "opt" + (ex.mono ? " mono" : "");
                if (s.checked) {
                  if (orig === 0) cls += " ok";
                  else if (pos === s.sel) cls += " bad";
                } else if (pos === s.sel) cls += " sel";
                return el(
                  "button",
                  {
                    class: cls,
                    type: "button",
                    role: "radio",
                    "aria-checked": pos === s.sel ? "true" : "false",
                    disabled: s.checked,
                    onclick: () => {
                      s.sel = pos;
                      render();
                    },
                  },
                  ex.o[orig],
                );
              }),
            );
          } else if (ex.t === "i") {
            ready = s.text.trim() !== "";
            body = el("input", {
              class: "text",
              type: "text",
              id: "answer",
              autocomplete: "off",
              autocapitalize: "off",
              spellcheck: "false",
              placeholder: "Écris ta réponse",
              value: s.text,
              disabled: s.checked,
              "aria-label": "Ta réponse",
              oninput: (e) => {
                s.text = e.target.value;
                const b = document.getElementById("primary");
                if (b && !s.checked) b.disabled = s.text.trim() === "";
              },
            });
          } else if (ex.t === "j") {
            if (s.jFor !== s.i) {
              s.text = ex.starter || "";
              s.jFor = s.i;
            } // code de départ à chaque nouvelle question
            ready =
              s.text.trim() !== "" &&
              s.text.trim() !== (ex.starter || "").trim();
            body = el(
              "div",
              { class: "list", style: "gap:8px" },
              el(
                "textarea",
                {
                  class: "text",
                  id: "answer",
                  rows: 9,
                  spellcheck: "false",
                  autocapitalize: "off",
                  autocomplete: "off",
                  placeholder: "Écris ton code Java…",
                  disabled: s.checked,
                  "aria-label": "Ton code Java",
                  onkeydown: (e) => {
                    // Tab insère 4 espaces au lieu de quitter le champ
                    if (e.key !== "Tab" || e.shiftKey) return;
                    e.preventDefault();
                    const t = e.target,
                      a = t.selectionStart;
                    t.value =
                      t.value.slice(0, a) +
                      "    " +
                      t.value.slice(t.selectionEnd);
                    t.selectionStart = t.selectionEnd = a + 4;
                    t.dispatchEvent(new Event("input"));
                  },
                  oninput: (e) => {
                    s.text = e.target.value;
                    const b = document.getElementById("primary");
                    if (b && !s.checked)
                      b.disabled =
                        s.text.trim() === "" ||
                        s.text.trim() === (ex.starter || "").trim();
                  },
                },
                s.text,
              ),
              el(
                "p",
                { class: "small muted" },
                "Correction par analyse du code (Java ne s'exécute pas dans le navigateur) · Ctrl+Entrée pour valider",
              ),
            );
          } else if (ex.t === "s") {
            sqlWarm();
            ready = s.text.trim() !== "";
            const runPreview = async () => {
              if (s.running || !s.text.trim()) return;
              s.running = true;
              render();
              try {
                s.preview = await sqlRun(s.text);
              } catch (e) {
                s.preview = {
                  error:
                    "Moteur SQL indisponible : impossible d'exécuter ici. Tu peux quand même valider ta réponse.",
                };
              }
              s.running = false;
              if (session === s) render();
            };
            body = el(
              "div",
              { class: "list", style: "gap:10px" },
              schemaBox(false),
              el(
                "textarea",
                {
                  class: "text",
                  id: "answer",
                  rows: 6,
                  spellcheck: "false",
                  autocapitalize: "off",
                  autocomplete: "off",
                  placeholder: "Écris ta requête SQL…",
                  disabled: s.checked || s.busy,
                  "aria-label": "Ta requête SQL",
                  oninput: (e) => {
                    s.text = e.target.value;
                    const b = document.getElementById("primary");
                    if (b && !s.checked && !s.busy)
                      b.disabled = s.text.trim() === "";
                  },
                },
                s.text,
              ),
              el(
                "div",
                { class: "row" },
                el("span", { class: "small muted grow" }, engineLabel()),
                el(
                  "button",
                  {
                    class: "btn ghost sm",
                    type: "button",
                    disabled: s.checked || s.busy || s.running,
                    onclick: runPreview,
                  },
                  s.running ? "Exécution…" : "Exécuter",
                ),
              ),
              !s.checked && s.preview
                ? resBlock(s.preview, "Ton résultat")
                : null,
            );
          } else {
            ready = s.picked.length === ex.parts.length;
            const zoneCls =
              "answer-zone" + (s.checked ? (s.correct ? " ok" : " bad") : "");
            body = el(
              "div",
              { class: "list", style: "gap:10px" },
              el(
                "div",
                { class: zoneCls, "aria-label": "Ta réponse" },
                s.picked.length
                  ? s.picked.map((k, pos) =>
                      el(
                        "button",
                        {
                          class: "chip",
                          type: "button",
                          disabled: s.checked,
                          onclick: () => {
                            s.picked.splice(pos, 1);
                            render();
                          },
                        },
                        ex.parts[k],
                      ),
                    )
                  : el(
                      "span",
                      { class: "small muted", style: "padding:8px" },
                      "Touche les lignes dans le bon ordre.",
                    ),
              ),
              el(
                "div",
                { class: "pool" },
                item.pool
                  .filter((k) => !s.picked.includes(k))
                  .map((k) =>
                    el(
                      "button",
                      {
                        class: "chip",
                        type: "button",
                        disabled: s.checked,
                        onclick: () => {
                          s.picked.push(k);
                          render();
                        },
                      },
                      ex.parts[k],
                    ),
                  ),
              ),
            );
          }

          let feedback = null;
          if (s.checked) {
            const expected =
              ex.t === "c"
                ? ex.o[0]
                : ex.t === "i"
                  ? ex.a[0]
                  : ex.t === "s" || ex.t === "j"
                    ? ex.sol
                    : ex.parts.join("\n");
            feedback = el(
              "div",
              {
                class: "feedback " + (s.correct ? "ok" : "bad"),
                role: "status",
              },
              el("strong", {}, s.correct ? "Bonne réponse" : "Pas tout à fait"),
              !s.correct
                ? ex.t === "o" || ex.t === "s" || ex.t === "j"
                  ? el("pre", {}, el("code", {}, expected))
                  : el("p", {}, "Réponse attendue : ", el("code", {}, expected))
                : null,
              el("p", {}, ex.w),
            );
          }

          const last = s.i + 1 === s.items.length;
          const exam = s.mode === "exam";
          const primary = el(
            "button",
            {
              id: "primary",
              class: "btn",
              type: "button",
              disabled: s.busy || (!s.checked && !ready),
              onclick: async () => {
                if (s.busy) return;
                if (exam) {
                  await check();
                  if (session !== s) return;
                  next();
                  render();
                  window.scrollTo(0, 0);
                  return;
                }
                if (!s.checked) await check();
                else next();
                if (session !== s) return;
                render();
                if (!s.checked) window.scrollTo(0, 0);
              },
            },
            s.busy
              ? "Correction…"
              : exam
                ? last
                  ? "Terminer l'examen"
                  : "Valider"
                : s.checked
                  ? last
                    ? "Voir le résultat"
                    : "Continuer"
                  : "Vérifier",
          );
          const skip = exam
            ? el(
                "button",
                {
                  class: "btn ghost",
                  type: "button",
                  disabled: s.busy,
                  onclick: async () => {
                    if (s.busy) return;
                    s.sel = null;
                    s.text = "";
                    s.picked = [];
                    await check();
                    if (session !== s) return;
                    next();
                    render();
                    window.scrollTo(0, 0);
                  },
                },
                "Passer",
              )
            : el("span");

          return el(
            "section",
            { class: "view" },
            el(
              "div",
              { class: "row" },
              quit,
              el(
                "span",
                { class: "muted small" },
                s.i + 1 + " / " + s.items.length,
                exam
                  ? el(
                      "span",
                      {
                        id: "timer",
                        class:
                          "timer" +
                          (s.deadline - Date.now() < 5 * 60000 ? " low" : ""),
                      },
                      " · " + fmtClock(s.deadline - Date.now()),
                    )
                  : null,
              ),
            ),
            progressBar(s.i, s.items.length, "Avancement"),
            el(
              "p",
              { class: "eyebrow" },
              s.mode === "review"
                ? (findUnit(item.ref.u)?.track.name || "") + " · révision"
                : s.title,
            ),
            el("h2", { class: "prompt" }, ex.q),
            ex.code ? el("pre", {}, el("code", {}, ex.code)) : null,
            body,
            feedback,
            ex.t === "s" && s.checked ? sqlGradeView(s.grade) : null,
            ex.t === "j" && s.checked && !s.correct
              ? javaGradeView(s.grade)
              : null,
            el("div", { class: "row" }, skip, primary),
          );
        }

        function examReview(s) {
          return el(
            "section",
            { class: "card list" },
            el("h2", {}, "Correction détaillée"),
            s.answers.map((a, k) => {
              const ex = a.item.ex;
              const expected =
                ex.t === "c"
                  ? ex.o[0]
                  : ex.t === "i"
                    ? ex.a[0]
                    : ex.t === "s" || ex.t === "j"
                      ? ex.sol
                      : ex.parts.join("\n");
              return el(
                "div",
                { class: "review" + (a.ok ? "" : " bad") },
                el(
                  "strong",
                  {},
                  k + 1 + ". " + (a.ok ? "Juste" : "Faux") + " · " + ex.q,
                ),
                ex.code ? el("pre", {}, el("code", {}, ex.code)) : null,
                !a.ok
                  ? el(
                      "p",
                      { class: "small" },
                      "Ta réponse : ",
                      a.given
                        ? el("code", {}, a.given)
                        : el("em", {}, "aucune"),
                    )
                  : null,
                !a.ok
                  ? ex.t === "s" || ex.t === "o" || ex.t === "j"
                    ? el("pre", {}, el("code", {}, expected))
                    : el(
                        "p",
                        { class: "small" },
                        "Réponse attendue : ",
                        el("code", {}, expected),
                      )
                  : null,
                el("p", { class: "small muted" }, ex.w),
              );
            }),
          );
        }

        function resultView() {
          const s = session;
          let title, text;
          if (s.mode === "unit") {
            title = s.passed ? "Unité validée" : "Encore un effort";
            text = s.passed
              ? s.gained
                ? "+" + s.gained + " XP."
                : "Unité déjà validée."
              : "Il faut au moins 75 % de bonnes réponses. Les questions ratées sont ajoutées à ta révision.";
          } else if (s.mode === "placement") {
            title = s.validated
              ? s.validated +
                " unité" +
                (s.validated > 1 ? "s" : "") +
                " validée" +
                (s.validated > 1 ? "s" : "")
              : "On commence au début";
            text =
              s.validated === s.track.units.length
                ? "Tu maîtrises tout le parcours " +
                  s.track.name +
                  ". +" +
                  s.gained +
                  " XP."
                : s.validated
                  ? "Tu reprends à l'unité " +
                    (s.validated + 1) +
                    ". +" +
                    s.gained +
                    " XP."
                  : "La première unité n'est pas encore acquise : commence par elle.";
          } else if (s.mode === "exam") {
            title =
              s.pct >= 80
                ? "Prêt pour l'évaluation"
                : s.pct >= 50
                  ? "En bonne voie"
                  : "À retravailler";
            text =
              (s.timeUp ? "Temps écoulé. " : "") +
              s.pct +
              " % de bonnes réponses en " +
              fmtClock(s.elapsed) +
              ". +" +
              s.gained +
              " XP. Les questions ratées sont ajoutées à ta révision.";
          } else {
            title = "Révision terminée";
            const left = dueMistakes().length;
            text =
              "+" +
              s.gained +
              " XP. " +
              (left
                ? left + " question(s) encore à revoir aujourd'hui."
                : "Plus rien à revoir aujourd'hui.") +
              " Série de révision : " +
              liveReviewStreak() +
              " j.";
          }
          const back = el(
            "button",
            {
              class: "btn ghost",
              type: "button",
              onclick: () => {
                if (s.track) ui.openTrack = s.track.id;
                session = null;
                ui.tab = s.mode === "review" ? "revision" : "parcours";
                render();
                window.scrollTo(0, 0);
              },
            },
            "Retour",
          );
          let again = null;
          if (s.mode === "unit") {
            const nxt =
              s.passed && s.unitIndex + 1 < s.track.units.length
                ? s.unitIndex + 1
                : null;
            again =
              nxt !== null
                ? el(
                    "button",
                    {
                      class: "btn",
                      type: "button",
                      id: "primary",
                      onclick: () => startUnit(s.track, nxt),
                    },
                    "Unité suivante",
                  )
                : el(
                    "button",
                    {
                      class: "btn",
                      type: "button",
                      id: "primary",
                      onclick: () => startUnit(s.track, s.unitIndex),
                    },
                    s.passed ? "Refaire" : "Réessayer",
                  );
          } else if (s.mode === "exam") {
            again = el(
              "button",
              {
                class: "btn",
                type: "button",
                id: "primary",
                onclick: () => startExam(s.track.id),
              },
              "Nouvel examen",
            );
          } else if (s.mode === "review" && dueMistakes().length) {
            again = el(
              "button",
              {
                class: "btn",
                type: "button",
                id: "primary",
                onclick: startReview,
              },
              "Continuer à réviser",
            );
          }
          const card = el(
            "section",
            { class: "card center view" },
            el("p", { class: "eyebrow" }, s.title),
            el("p", { class: "big" }, s.score + "/" + s.total),
            el("h2", {}, title),
            el("p", { class: "muted" }, text),
            el(
              "div",
              { class: "row", style: "justify-content:center" },
              back,
              again,
            ),
          );
          return s.mode === "exam"
            ? el("div", { class: "view" }, card, examReview(s))
            : card;
        }

        /* ---------- Clavier : Entrée = action principale ---------- */
        document.addEventListener("keydown", (e) => {
          if (e.key !== "Enter") return;
          const tag = e.target && e.target.tagName;
          if (tag === "TEXTAREA") {
            // Entrée = retour à la ligne ; Ctrl+Entrée = exécuter (bac à sable) ou valider (exercice).
            if (!(e.ctrlKey || e.metaKey)) return;
            e.preventDefault();
            if (!session && ui.tab === "sandbox") {
              runBox(false);
              return;
            }
          }
          if (!session) return;
          if (tag === "BUTTON" && e.target.id !== "primary") return;
          const b = document.getElementById("primary");
          if (b && !b.disabled) {
            e.preventDefault();
            b.click();
          }
        });

        /* ---------- Démarrage ---------- */
        const h = (location.hash || "").slice(1);
        if (TABS.some((t) => t.id === h) || h === "sandbox") ui.tab = h;
        render();
        initSync();
      })();
    </script>
  </body>
</html>
